services:
  db:
    image: postgres:18
    environment:
      POSTGRES_DB: ${POSTGRES_DB}
      POSTGRES_USER: ${POSTGRES_USER}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD}
    ports:
      - "5432:5432"
    volumes:
      - db-data:/var/lib/postgresql
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U $${POSTGRES_USER} -d $${POSTGRES_DB}"]
      interval: 5s
      timeout: 5s
      retries: 10

  api:
    build: ./api
    environment:
      # "db" es el nombre del servicio: dentro de la red de Docker funciona como hostname.
      # Spring Boot toma SPRING_DATASOURCE_URL como la propiedad spring.datasource.url
      SPRING_DATASOURCE_URL: jdbc:postgresql://db:5432/${POSTGRES_DB}
      # Las lee application.properties con ${DB_USERNAME} y ${DB_PASSWORD}
      DB_USERNAME: ${POSTGRES_USER}
      DB_PASSWORD: ${POSTGRES_PASSWORD}
    ports:
      - "8080:8080"
    depends_on:
      db:
        condition: service_healthy

  frontend:
    build:
      context: ./frontend
      args:
        # La usa el navegador, que corre fuera de Docker: llega a la API por el puerto publicado
        NEXT_PUBLIC_API_URL: http://localhost:8080
    environment:
      # La usa el servidor de Next, que corre dentro de la red de Docker
      API_URL: http://api:8080
    ports:
      - "3000:3000"
    depends_on:
      - api

volumes:
  db-data:
