spring.application.name=practica

# Valores para correr la API fuera de Docker con un Postgres local.
# En Docker, compose.yaml los reemplaza con las variables SPRING_DATASOURCE_URL, etc.
spring.datasource.url=jdbc:postgresql://localhost:5432/reservations_db
spring.datasource.username=deso
spring.datasource.password=deso

# JPA / Hibernate
# update: crea las tablas que falten sin borrar los datos, que ahora persisten en el volumen de Postgres
spring.jpa.hibernate.ddl-auto=update
# Muestra en consola el SQL que Hibernate genera por nosotros
spring.jpa.show-sql=true
spring.jpa.open-in-view=false
# Ejecutar data.sql DESPUÉS de que Hibernate cree las tablas
spring.jpa.defer-datasource-initialization=true
# Por defecto Spring solo ejecuta data.sql con bases embebidas como H2
spring.sql.init.mode=always

# CORS: orígenes que pueden llamar a la API desde el navegador (ver CorsConfig)
app.cors.allowed-origins=http://localhost:3000
