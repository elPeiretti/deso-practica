spring.application.name=practica

# Consola web de H2 en http://localhost:8080/h2-console
# JDBC URL: jdbc:h2:mem:reservations_db  (usuario: sa, sin contraseña)
spring.h2.console.enabled=true

# Conexión a la base de datos (la lee DatabaseConnection)
# Si cambia la URL, use la misma en la consola web de H2.
app.db.url=jdbc:h2:mem:reservations_db;DB_CLOSE_DELAY=-1;INIT=RUNSCRIPT FROM 'classpath:schema.sql'
app.db.user=sa
app.db.password=
