spring.application.name=practica

# Consola web de H2 en http://localhost:8080/h2-console
# JDBC URL: jdbc:h2:mem:reservations_db  (usuario: sa, sin contraseña)
spring.h2.console.enabled=true

# Los ResponseStatusException se devuelven como ProblemDetail (RFC 9457) con el mensaje en "detail"
spring.mvc.problemdetails.enabled=true
