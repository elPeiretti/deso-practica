spring.application.name=practica

# Consola web de H2 en http://localhost:8080/h2-console
# JDBC URL: jdbc:h2:mem:reservations_db  (usuario: sa, sin contraseña)
spring.h2.console.enabled=true

# Conexión a la base de datos (la lee Spring Boot y arma el DataSource automáticamente)
spring.datasource.url=jdbc:h2:mem:reservations_db;DB_CLOSE_DELAY=-1
spring.datasource.username=sa
spring.datasource.password=

# JPA / Hibernate
# create-drop: Hibernate crea las tablas a partir de las @Entity al iniciar y las borra al cerrar
spring.jpa.hibernate.ddl-auto=create-drop
# Muestra en consola el SQL que Hibernate genera por nosotros
spring.jpa.show-sql=true
spring.jpa.open-in-view=false
# Ejecutar data.sql DESPUÉS de que Hibernate cree las tablas
spring.jpa.defer-datasource-initialization=true
